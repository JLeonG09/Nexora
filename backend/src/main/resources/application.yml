spring:
  application:
    name: nexora-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${DB_USERNAME:nexora}
    password: ${DB_PASSWORD:nexora_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  explorer-base-url: ${STELLAR_EXPLORER_BASE_URL:https://stellar.expert/explorer/testnet}
  usdc-contract-id: ${USDC_CONTRACT_ID:CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA}
  network: ${STELLAR_NETWORK:TESTNET}
  approval-ttl-hours: ${APPROVAL_TTL_HOURS:24}
  rate-limit:
    chat-per-minute: ${RATE_LIMIT_CHAT_PER_MINUTE:20}
    proposals-per-10-min: ${RATE_LIMIT_PROPOSALS_PER_10_MIN:5}
  demo-attack-enabled: ${DEMO_ATTACK_ENABLED:false}
  # App ID de Privy. El access token (ES256) se valida contra
  # https://auth.privy.io/api/v1/apps/${PRIVY_APP_ID}/jwks.json
  # iss = privy.io y aud = este id. Vacío solo se admite con firmante e IA en mock.
  privy-app-id: ${PRIVY_APP_ID:}
  # Sin default: una clave corta o de ejemplo impide el arranque.
  agent-tools-key: ${AGENT_TOOLS_KEY:}
  ai:
    mode: ${AI_MODE:mock}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    service-key: ${AI_SERVICE_KEY:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}
    min-confidence: ${AI_MIN_CONFIDENCE:0.7}
    # Con AI_MODE=hybrid o local: modelo que sirve Ollama o `cactus serve`.
    model: ${AI_MODEL:qwen2.5:0.5b}
  signer:
    mode: ${SIGNER_MODE:mock}
    base-url: ${SIGNER_BASE_URL:http://localhost:3001}
    service-key: ${SIGNER_SERVICE_KEY:}
    connect-timeout-ms: ${SIGNER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SIGNER_READ_TIMEOUT_MS:45000}
    mock:
      onchain-daily-limit: "50"
  stellar-events:
    mode: ${STELLAR_EVENTS_MODE:mock}
    rpc-url: ${STELLAR_RPC_URL:https://soroban-testnet.stellar.org}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    sent-poll-interval-ms: ${SENT_POLL_INTERVAL_MS:10000}
    approval-expiry-interval-ms: ${APPROVAL_EXPIRY_INTERVAL_MS:60000}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    interval-ms: ${RECONCILIATION_INTERVAL_MS:60000}
