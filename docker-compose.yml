# Nexora en Docker: Postgres + agente (Ollama) + backend + frontend (nginx), todos en la red `nexora_default`.
#
#   cp .env.example .env          # y cambia DB_PASSWORD y AGENT_TOOLS_KEY
#   docker compose up -d --build  # panel en http://localhost:8081
#
# La primera vez el agente descarga el modelo (AI_MODEL, ~400 MB); `docker compose logs -f agent` muestra el avance.
# Con AI_MODE=hybrid el chat funciona desde el principio: las reglas no necesitan el modelo.
#
# El firmante real va aparte porque necesita signer/.env con secretos de testnet:
#   docker compose --profile signer up -d --build   (con SIGNER_MODE=http en .env)

name: nexora

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Modelo propio con API compatible con OpenAI. Cactus no compila en x86, por eso aquí va Ollama.
  agent:
    image: ollama/ollama:latest
    entrypoint:
      - /bin/sh
      - -c
      - ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$AI_MODEL" && wait
    environment:
      AI_MODEL: ${AI_MODEL:-qwen2.5:0.5b}
      OLLAMA_HOST: 0.0.0.0:11434
      # Libera la RAM si nadie escribe en 5 minutos; el siguiente mensaje lo vuelve a cargar (~1 s).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    cpus: ${AGENT_CPUS:-4}
    mem_limit: ${AGENT_MEMORY:-2g}
    volumes:
      - agent-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$AI_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15m
    ports:
      - "127.0.0.1:${AGENT_PORT:-11434}:11434"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexora
      DB_USERNAME: nexora
      DB_PASSWORD: ${DB_PASSWORD}
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:?Define AGENT_TOOLS_KEY en .env}
      # El panel de nginx es mismo origen; 5173 es `pnpm dev` (su proxy conserva el Origin del navegador).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081},http://localhost:5173}
      AI_MODE: ${AI_MODE:-hybrid}
      AI_BASE_URL: ${AI_BASE_URL:-http://agent:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:0.5b}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-cambia-esto}
      # Con hybrid, si el modelo no responde a tiempo el chat sigue con las reglas.
      AI_READ_TIMEOUT_MS: ${AI_READ_TIMEOUT_MS:-30000}
      SIGNER_MODE: ${SIGNER_MODE:-mock}
      SIGNER_BASE_URL: http://signer:3001
      SIGNER_SERVICE_KEY: ${SIGNER_SERVICE_KEY:-cambia-esto}
      STELLAR_EVENTS_MODE: ${STELLAR_EVENTS_MODE:-mock}
      DEMO_ATTACK_ENABLED: ${DEMO_ATTACK_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  signer:
    build: ./signer
    profiles: ["signer"]
    env_file:
      - path: ./signer/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - signer-data:/app/data
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PRIVY_APP_ID: ${VITE_PRIVY_APP_ID:-}
        VITE_PRIVY_CLIENT_ID: ${VITE_PRIVY_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  db-data:
  agent-models:
  signer-data:
