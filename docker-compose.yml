# Nexora en Docker: Postgres + backend + frontend (nginx).
#
#   cp .env.example .env          # y cambia DB_PASSWORD y AGENT_TOOLS_KEY
#   docker compose up --build     # panel en http://localhost:8081
#
# El firmante real va aparte porque necesita signer/.env con secretos de testnet:
#   docker compose --profile signer up --build   (con SIGNER_MODE=http en .env)

name: nexora

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexora
      DB_USERNAME: nexora
      DB_PASSWORD: ${DB_PASSWORD}
      AGENT_TOOLS_KEY: ${AGENT_TOOLS_KEY:?Define AGENT_TOOLS_KEY en .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8081}
      AI_MODE: ${AI_MODE:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-cambia-esto}
      SIGNER_MODE: ${SIGNER_MODE:-mock}
      SIGNER_BASE_URL: http://signer:3001
      SIGNER_SERVICE_KEY: ${SIGNER_SERVICE_KEY:-cambia-esto}
      STELLAR_EVENTS_MODE: ${STELLAR_EVENTS_MODE:-mock}
      DEMO_ATTACK_ENABLED: ${DEMO_ATTACK_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  signer:
    build: ./signer
    profiles: ["signer"]
    env_file:
      - path: ./signer/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - signer-data:/app/data
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PRIVY_APP_ID: ${VITE_PRIVY_APP_ID:-}
        VITE_PRIVY_CLIENT_ID: ${VITE_PRIVY_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  db-data:
  signer-data:
